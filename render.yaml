services:
  # Python Flask Backend Web Service (Free Tier)
  - type: web
    name: doomverse-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # React Static Site Frontend (Free Tier)
  - type: web
    name: doomverse-frontend
    env: static
    plan: free
    buildCommand: npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: doomverse-backend
          property: host
